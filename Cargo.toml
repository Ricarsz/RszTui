[package]
name = "rogtui"
version = "0.1.0"
edition = "2024"
description = "ASUS TUF 终端控制台：性能模式、电池、功耗、风扇、灯光与网络"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[[bin]]
name = "rogtui"
path = "src/main.rs"
